# Serves the dashboard website and forwards its API calls to the Go dashboard API.
server {
    listen 80;
    root /usr/share/nginx/html;

    # Look up "dashboard-api" again every 10 seconds, so a restarted Go container is found.
    resolver 127.0.0.11 valid=10s;
    set $dashboard_api http://dashboard-api:8000;

    location /api/ {
        proxy_pass $dashboard_api;
    }

    location = /health {
        proxy_pass $dashboard_api;
    }

    # Every other path is a page of the website.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
