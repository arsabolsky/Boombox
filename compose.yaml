# Starts the whole backend:  docker compose up --build
#
#   database        PostgreSQL with the empty tables               (server/database)
#   client-api      Python: clients + AI      http://localhost:8080/docs   (server/client-api)
#   dashboard-api   Go: the dashboard's API   http://localhost:8000/health (server/dashboard-api)
#   dashboard       Vue: the dashboard website  http://localhost              (dashboard/frontend/boombox)
#
# The database starts empty the first time. To empty it again: docker compose down -v

services:
  database:
    restart: unless-stopped
    image: postgres:16
    environment:
      POSTGRES_USER: boombox
      POSTGRES_PASSWORD: boombox
      POSTGRES_DB: boombox
    ports:
      - "5432:5432"
    volumes:
      - database:/var/lib/postgresql/data
      - ./server/database/schema.sql:/docker-entrypoint-initdb.d/1-schema.sql:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "boombox"]
      interval: 2s
      retries: 30

  client-api:
    restart: unless-stopped
    build: ./server/client-api
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: postgresql://boombox:boombox@database:5432/boombox
      TYPESAFE_API_KEY: ${TYPESAFE_API_KEY:-}   # blank: POST /api/v1/results answers 503
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      JEV_MODEL: ${JEV_MODEL:-jev-latest}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5}
    depends_on:
      database:
        condition: service_healthy

  dashboard-api:
    restart: unless-stopped
    build: ./server/dashboard-api
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://boombox:boombox@database:5432/boombox
    depends_on:
      database:
        condition: service_healthy

  dashboard:
    restart: unless-stopped
    build: ./dashboard   # builds the website and serves it with nginx (dashboard/Dockerfile)
    ports:
      - "80:80"
    depends_on:
      - dashboard-api

volumes:
  database:
